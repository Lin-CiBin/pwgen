<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>密码计算器</title>
<style>
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:420px;margin:0 auto;padding:24px 16px;background:#f5f5f7;color:#222}
h1{font-size:20px;margin:0 0 20px}
label{display:block;font-size:14px;color:#666;margin:16px 0 6px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:12px;border:1px solid #ccc;border-radius:10px;background:#fff}
button{width:100%;font-size:18px;padding:14px;margin-top:20px;border:0;border-radius:10px;background:#0a84ff;color:#fff}
#out{margin-top:24px;padding:16px;background:#fff;border-radius:10px;font-size:22px;font-family:Menlo,Consolas,monospace;text-align:center;word-break:break-all;display:none}
.row{display:flex;gap:8px}.row input{flex:1}
small{color:#999}
</style>
</head>
<body>
<noscript><p style="color:#c00">当前打开方式不支持脚本，请用浏览器（Chrome / Safari）打开此文件。</p></noscript>
<h1>密码计算器</h1>
<label>主口令</label>
<input id="m" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
<label>周期 <small>(年份-第几个双月，如 2026-05)</small></label>
<input id="p" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="go">计算</button>
<div id="out"></div>
<script>
function sha256(bytes){
  var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  var l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;
  var bits=l*8;for(var i=0;i<4;i++)m[n-1-i]=(bits>>>(8*i))&255;
  var W=new Array(64);
  for(var o=0;o<n;o+=64){
    for(var t=0;t<16;t++)W[t]=(m[o+4*t]<<24)|(m[o+4*t+1]<<16)|(m[o+4*t+2]<<8)|m[o+4*t+3];
    for(t=16;t<64;t++){var x=W[t-15],y=W[t-2];
      var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3);
      var s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);
      W[t]=(W[t-16]+s0+W[t-7]+s1)|0;}
    var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(t=0;t<64;t++){
      var S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
      var t1=(h+S1+((e&f)^(~e&g))+K[t]+W[t])|0;
      var S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
      var t2=(S0+((a&b)^(a&c)^(b&c)))|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;
    H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}
  var out=new Uint8Array(32);for(i=0;i<8;i++){out[4*i]=H[i]>>>24;out[4*i+1]=(H[i]>>>16)&255;out[4*i+2]=(H[i]>>>8)&255;out[4*i+3]=H[i]&255;}
  return out;
}
function hmac(key,msg){
  if(key.length>64)key=sha256(key);
  var k=new Uint8Array(64);k.set(key);
  var ip=new Uint8Array(64+msg.length),op=new Uint8Array(96);
  for(var i=0;i<64;i++){ip[i]=k[i]^0x36;op[i]=k[i]^0x5c;}
  ip.set(msg,64);op.set(sha256(ip),64);return sha256(op);
}
function utf8(s){var e=unescape(encodeURIComponent(s)),u=new Uint8Array(e.length);for(var i=0;i<e.length;i++)u[i]=e.charCodeAt(i);return u;}
function b64(u){var s="";for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s);}
function gen(master,period){
  var core=b64(hmac(utf8(master),utf8(period))).replace(/\+/g,"x").replace(/\//g,"y").slice(0,10);
  return "A"+core+"9!";
}
var d=new Date(),pd=document.getElementById("p");
pd.placeholder=d.getFullYear()+"-"+("0"+Math.floor((d.getMonth()+2)/2)).slice(-2);
function run(){
  var o=document.getElementById("out");o.style.display="block";
  try{
    var m=document.getElementById("m").value,p=pd.value.replace(/^\s+|\s+$/g,"")||pd.placeholder;
    if(!m){o.textContent="请输入主口令";return;}
    o.innerHTML="<small>周期 "+p+"</small><br>"+gen(m,p);
  }catch(err){o.textContent="出错了: "+err;}
}
document.getElementById("go").onclick=run;
document.getElementById("m").onkeydown=pd.onkeydown=function(e){if(e.keyCode===13){e.preventDefault();run();}};
if(typeof module!=="undefined")module.exports=gen;
</script>
</body>
</html>
